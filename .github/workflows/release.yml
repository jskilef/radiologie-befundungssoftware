name: Verify and release

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the current VERSION after all checks pass (main only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      publish: ${{ steps.release_request.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node verify-all.cjs
      - name: Check release archive
        shell: pwsh
        run: ./build-release.ps1
      - name: Determine whether a release was requested
        id: release_request
        run: node scripts/release-requested.cjs

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install pinned test dependencies
        run: |
          npm install --global pnpm@11.19.0 --ignore-scripts
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Install test browser
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: Exercise browser workflows with synthetic fixtures
        run: pnpm test:browser --project=${{ matrix.browser }}
      - name: Save browser report and failure traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-results-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  release:
    needs: [verify, browser]
    if: needs.verify.outputs.publish == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build checked release files
        shell: pwsh
        run: ./build-release.ps1
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          if gh release view "$tag" --json isDraft > release-state.json 2>/dev/null; then
            target="$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '.object.sha')"
            if [[ "$target" != "$GITHUB_SHA" ]]; then
              echo 'Existing release points to another commit; refusing to replace it.' >&2
              exit 1
            fi
            if [[ "$(jq -r '.isDraft' release-state.json)" == false ]]; then
              echo "Release $tag is already published at this commit."
              exit 0
            fi
          else
            gh release create "$tag" --draft --target "$GITHUB_SHA" \
              --title "Report Studio $tag" --notes-file release-notes.md
          fi
          gh release upload "$tag" "dist/report-studio-v$version.zip" \
            dist/report-studio.html dist/SHA256SUMS.txt --clobber
          gh release edit "$tag" --draft=false --latest \
            --title "Report Studio $tag" --notes-file release-notes.md
